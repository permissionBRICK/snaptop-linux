# systemd-based initramfs for the Vivobook S15 (docs/steamos.md#initramfs): boot drivers (s15), DSPs and display
# (s15-dsp, kms), keyboard and console keymap/font (/etc/vconsole.conf) for a LUKS passphrase prompt, the firmware TPM
# (tpm_qcom_crb) for unlocking with the TPM, LUKS (sd-encrypt, idle without crypttab/rd.luks), SteamOS's /etc overlay.
MODULES=(tpm_qcom_crb i2c_hid_of hid_asus_ec hid_generic hid_multitouch)
BINARIES=()
FILES=()
HOOKS=(base systemd autodetect modconf kms keyboard sd-vconsole s15 s15-dsp block sd-encrypt filesystems sd-s15-etc-overlay)
COMPRESSION="zstd"
MODULES_DECOMPRESS="yes"
